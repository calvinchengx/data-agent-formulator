[project]
name = "data-agent-formulator"
version = "0.1.0"
description = "A Data Formulator data loader that reads through data-agent-service's executor"
requires-python = ">=3.12"
dependencies = [
  # The pin from docs/00-plan.md §11. It is a real dependency rather than a
  # dev one: the loader is imported by Data Formulator, so the interface it
  # implements has to be the installed one, and tests/test_interface_pin.py
  # introspects this package rather than trusting the prose.
  "data-formulator==0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  # Pinned to a floor rather than a version, as in the rest of the family:
  # the ruleset below is what makes runs reproducible, and an older ruff
  # would not understand it.
  "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
